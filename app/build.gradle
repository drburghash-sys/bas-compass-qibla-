plugins {
    id 'com.android.application'
}
android {
    namespace 'com.bas.compass'
    compileSdk 35
    defaultConfig {
        applicationId 'com.bas.compass'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
